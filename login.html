<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Login</title>
</head>
<body>
    <form>
        <h1>Form Login</h1>
        <fieldset>
            <legend>Login</legend><br>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Masukkan Username" required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Masukkan password" required><br><br>

            <input type="checkbox" id="rm" name="rm" required>
            <label for="rm">Remember me</label><br><br>

            <button type="submit" formaction="tabel.html">Login</button>
            <button type="reset">Reset</button>

        </fieldset>
    </form>
</body>
</html>
