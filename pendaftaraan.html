<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran</title>
</head>
<body>
    <form>
    <h1>Form Pendaftaran</h1>
    <fieldset>
        <legend>Pendaftaran Siswa</legend><br>
        
        <label for="nama-lengkap">Nama Lengkap:</label>
        <input type="text" id="nama-lengkap" name="nama-lengkap" placeholder="Masukkan nama lengkap" required><br><br>

        <label for="nis">NIS:</label>
        <input type="text" id="nis" name="nis" placeholder="Masukkan NIS" required><br><br>

        <label for="jk">Jenis Kelamin:</label>
        <input type="radio" id="jk" name="jk" required>
        <label for="jk">Laki-laki</label>
        <input type="radio" id="jk" name="jk" required>
        <label for="jk">Perempuan</label><br><br>

        <label for="date">Tanggal Lahir:</label>
        <input type="date" id="date" name="date" required><br><br>

        <label for="jurusan">Jurusan:</label>
        <select name="jurusna" id="jurusan" required>
            <option value="pilih-jurusan">-- Pilih Jurusan --</option>
            <option value="RPL">Rekayasa Perangkat Lunak (RPL)</option>
            <option value="TKJ">Teknik Komputer Jringan (TKJ)</option>
            <option value="TKR">Teknik Kendaraan Ringan (TKR)</option>
            <option value="TSM">Teknik Sepeda Motor (TSM)</option>
            <option value="Boga">Kuliner</option>
            <option value="Busana">Busana</option>
        </select><br><br>

        <label for="alamat">Alamat:</label><br>
        <textarea name="alamat" id="alamat" placeholder="Masukkan alamat lengkap" cols="40" rows="4" required></textarea><br><br>

        <label for="foto">Foto:</label>
        <input type="file" id="foto" name="foto" accept="immage" required><br><br>

        <input type="checkbox">
        <label for="setuju">Saya menyetujui data yang saya masukkan</label><br><br>

        <button type="submit" formaction="login.html">Daftar</button>
        <button type="reset">Reset</button>
    </fieldset>
    </form>
</body>
</html>
