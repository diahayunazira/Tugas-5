<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form URL</title>
</head>
<body>
    <form>
        <h1>Form URL</h1>
        <fieldset>
            <legend>URL</legend><br>

            <label for="url">URL:</label>
            <input type="url" id="url" name="url" placeholder="Masukkan URL" required><br><br>

            <label for="date">Tanggal:</label>
            <input type="date" id="date" name="date" required><br><br>

            <label for="time">Waktu:</label>
            <input type="time" id="time" name="time" required><br><br>

            <label for="jml">Jumlah</label>
            <input type="number" id="jml" name="jml" required><br><br>

            <button type="submit" formaction="login.html">Send</button>
            <button type="reset">Reset</button>
        </fieldset>
    </form>
</body>
</html>
